[tool.poetry]
name = "pytest-environment"
version = "0.0.0"
description = "Pytest Environment"
authors = ["Kyle Oliver <56kyleoliver@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/56kyle/pytest-environment"
repository = "https://github.com/56kyle/pytest-environment"
documentation = "https://pytest-environment.readthedocs.io"
classifiers = [
    "Development Status :: 1 - Planning",
]

[tool.poetry.urls]
Changelog = "https://github.com/56kyle/pytest-environment/releases"

[tool.poetry.dependencies]
python = "^3.9"
click = ">=8.0.1"
pytest = "^8.1.1"
loguru = "^0.7.2"
platformdirs = "^4.2.2"

[tool.poetry.dev-dependencies]
Pygments = ">=2.10.0"
coverage = ">=6.2"
darglint = ">=1.8.1"
furo = ">=2021.11.12"
isort = ">=5.10.1"
mypy = ">=0.930"
pep8-naming = ">=0.12.1"
pre-commit = ">=2.16.0"
pre-commit-hooks = ">=4.1.0"
pytest = ">=6.2.5"
sphinx = ">=4.3.2"
sphinx-autobuild = ">=2021.3.14"
sphinx-click = ">=3.0.2"
typeguard = ">=2.13.3"
xdoctest = {extras = ["colors"], version = ">=0.15.10"}
myst-parser = {version = ">=0.16.1"}

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.5"
pip-audit = "^2.9.0"

[tool.poetry.scripts]
pytest-environment = "pytest_environment.__main__:main"

[tool.poetry.plugins.pytest11]
pytest_environment = "pytest_environment.plugin"

[tool.pytest.ini_options]
pythonpath = "src"
pytester_example_dir = "./tests/data/plugin_tests"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
